<header class="header">
  <div class="container header-inner">
    <a href="{% url 'main:index' %}" class="logo">НЕРЖАВЕЙКА</a>

    <nav class="nav">
      <ul class="nav-list">
        <li>
          <a href="{% url 'main:index' %}" class="nav-link nav__link{% if request.resolver_match.url_name == 'index' %} nav-link--active nav__link--active{% endif %}">
            Главная
          </a>
        </li>
        <li>
          <a href="{% url 'main:about' %}" class="nav-link nav__link{% if request.resolver_match.url_name == 'about' %} nav-link--active nav__link--active{% endif %}">
            О нас
          </a>
        </li>
        <li>
          <a href="{% url 'main:products' %}" class="nav-link nav__link{% if request.resolver_match.url_name == 'products' %} nav-link--active nav__link--active{% endif %}">
            Магазины
          </a>
        </li>
        <li>
          <a href="{% url 'main:gallery' %}" class="nav-link nav__link{% if request.resolver_match.url_name == 'gallery' %} nav-link--active nav__link--active{% endif %}">
            Галерея
          </a>
        </li>
      </ul>
    </nav>

    <div class="header-contacts">
      <a href="tel:+996998666555" class="header-phones">
        <svg class="header-phone-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.5 0 1 .4 1 1V20c0 .6-.5 1-1 1C10.6 21 3 13.4 3 4c0-.5.4-1 1-1h3.5c.5 0 1 .5 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.3 1l-2.2 2.2z"/>
        </svg>
        <span>
          <strong>+996 998 666 555</strong>
          <strong>+996 778 666 555</strong>
        </span>
      </a>
      <a href="{% url 'main:contacts' %}" class="btn btn--primary header-cta">Контакты</a>
    </div>

    <button type="button" class="burger" id="burger" aria-expanded="false">
      <span></span>
      <span></span>
    </button>
  </div>

  <nav class="mobile-menu" id="mobileMenu">
    <div class="mobile-menu-top">
      <a href="{% url 'main:index' %}" class="mobile-menu-logo">НЕРЖАВЕЙКА</a>
      <button type="button" class="mobile-menu-close" id="mobileClose">×</button>
    </div>

    <ul class="mobile-menu-nav mobile-menu__nav">
      <li><a href="{% url 'main:index' %}" class="nav-link">Главная</a></li>
      <li><a href="{% url 'main:about' %}" class="nav-link">О нас</a></li>
      <li><a href="{% url 'main:products' %}" class="nav-link">Магазины</a></li>
      <li><a href="{% url 'main:gallery' %}" class="nav-link">Галерея</a></li>
      <li><a href="{% url 'main:contacts' %}" class="nav-link">Контакты</a></li>
    </ul>

    <div class="mobile-menu-contacts">
      <a href="tel:+996998666555">+996 998 666 555</a>
      <a href="tel:+996778666555">+996 778 666 555</a>
      <a href="{% url 'main:gallery' %}" class="mobile-menu-gallery">Перейти к галерее <span>→</span></a>
    </div>
  </nav>
</header>
